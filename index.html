<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fadli's AI Virtual Office - Isometric View</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #07090e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            background: linear-gradient(90deg, #ff7b00, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }
        #status-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 123, 0, 0.3);
            padding: 12px 16px;
            border-radius: 12px;
            width: 250px;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .robot-status-item {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .robot-status-item span {
            color: #ff7b00;
            font-weight: bold;
        }
        #control-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 123, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 10;
            width: 440px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            background: #0b0f19;
            border: 1px solid #334155;
            padding: 10px 14px;
            color: white;
            border-radius: 8px;
            flex: 1;
            outline: none;
            font-size: 13px;
        }
        input:focus {
            border-color: #ff7b00;
        }
        button {
            background: linear-gradient(135deg, #ff7b00, #ff5100);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #log-box {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #ff7b00;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>Fadli's AI Virtual Office</h1>
        <p>Orchestrator: Boss Fadli | Isometric 3D View</p>
    </div>

    <div id="status-panel">
        <p style="font-weight: bold; color: #fff; margin-bottom: 8px;">LIVE WORKFORCE STATUS</p>
        <div id="status-list"></div>
    </div>

    <div id="control-panel">
        <div class="input-row">
            <input type="text" id="promptInput" placeholder="Cth: @Delta buat kopi / @Alpha matikan lampu">
            <button onclick="sendCommand()">Eksekusi</button>
        </div>
        <div id="log-box">Sistem siap. Ketik perintah berformat @namarobot [perintah]...</div>
    </div>

    <script>
        // --- SETUP SCENE & ISOMETRIC CAMERA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07090e);
        scene.fog = new THREE.FogExp2(0x07090e, 0.008);

        // Kamera sudut pandang isometrik miring ala referensi
        const aspect = window.innerWidth / window.innerHeight;
        const d = 18;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
        camera.position.set(25, 22, 25);
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING & LED STRIP ORANYE/BIRU ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Lampu Neon Strip Oranye di Lantai 2 (Khas Orca Style)
        const neonOrange = new THREE.PointLight(0xff7b00, 2, 35);
        neonOrange.position.set(0, 9, 0);
        scene.add(neonOrange);

        // --- ARSITEKTUR GEDUNG 2 LANTAI (RAPI & ESTETIK) ---
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.5 });
        
        // Lantai 1
        const floor1 = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4, 20), floorMat);
        floor1.position.set(0, -0.2, 0);
        scene.add(floor1);

        // Lantai 2 (Lebih ringkas/panggung atas)
        const floor2 = new THREE.Mesh(new THREE.BoxGeometry(32, 0.4, 20), floorMat);
        floor2.position.set(0, 8.5, 0);
        scene.add(floor2);

        // Dinding Belakang & Partisi
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(32, 9, 0.4), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        backWall.position.set(0, 4, -10);
        scene.add(backWall);

        const backWall2 = new THREE.Mesh(new THREE.BoxGeometry(32, 9, 0.4), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        backWall2.position.set(0, 13, -10);
        scene.add(backWall2);

        // --- RUANG KERJA BOS (FADLI) DI LANTAI 2 ---
        const bossDesk = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 }));
        bossDesk.position.set(0, 8.8, -5);
        scene.add(bossDesk);

        const fadliAvatar = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.7), newTHREE_mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
        // Avatar Fadli (Bos)
        const fadliMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1, 0.7), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
        fadliMesh.position.set(0, 9.5, -5);
        scene.add(fadliMesh);

        // --- DERETAN MEJA KERJA TIM AI DI LANTAI 2 ---
        for(let i = 0; i < 4; i++) {
            let xPos = (i - 1.5) * 6;
            let workDesk = new THREE.Mesh(new THREE.BoxGeometry(4, 0.25, 1.8), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
            workDesk.position.set(xPos, 8.8, 3);
            scene.add(workDesk);

            let monitor = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.5 }));
            monitor.position.set(xPos, 9.6, 2.9);
            scene.add(monitor);
        }

        // --- AREA LANTAI 1 (COFFEE BAR, SOFA, RUANG SHOLAT, LIFT) ---
        // Coffee Bar
        const coffeeCounter = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 2), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        coffeeCounter.position.set(10, 0.5, 5);
        scene.add(coffeeCounter);

        const coffeeMachine = new THREE.Mesh(new THREE.BoxGeometry(1, 0.9, 0.8), new THREE.MeshStandardMaterial({ color: 0xff7b00, emissive: 0x442200 }));
        coffeeMachine.position.set(10, 1.45, 5);
        scene.add(coffeeMachine);

        const coffeeCup = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.22, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 }));
        coffeeCup.position.set(9.2, 1.15, 5);
        scene.add(coffeeCup);

        // Sofa Santai
        const sofa = new THREE.Mesh(new THREE.BoxGeometry(5, 0.7, 2), new THREE.MeshStandardMaterial({ color: 0x475569 }));
        sofa.position.set(-10, 0.35, -5);
        scene.add(sofa);

        // Ruang Sholat (Sajadah)
        const prayerMat = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.04, 3.8), new THREE.MeshStandardMaterial({ color: 0x065f46 }));
        prayerMat.position.set(-10, 0.02, 5);
        scene.add(prayerMat);

        // Tangga Modern & Lift
        for(let i=0; i<8; i++) {
            let step = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0x64748b }));
            step.position.set(13, i * 1.05 + 0.5, -3 + (i * 0.6));
            scene.add(step);
        }

        // Saklar Lampu Dinding
        const lightSwitch = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.1), new THREE.MeshStandardMaterial({ color: 0xff7b00, emissive: 0x7c2d12 }));
        lightSwitch.position.set(-15.8, 2, 0);
        scene.add(lightSwitch);

        // --- MODEL ROBOT KOTAK (BLOCKY MECHA ROBOT) ---
        function createBlockyRobot(colorHex) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

            // Kaki
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.4, 0.16), darkMat);
            legL.position.set(-0.14, 0.2, 0);
            group.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.4, 0.16), darkMat);
            legR.position.set(0.14, 0.2, 0);
            group.add(legR);

            // Badan
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.35), mat);
            torso.position.y = 0.7;
            group.add(torso);

            // Kepala
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.35), mat);
            head.position.y = 1.2;
            group.add(head);

            // Visor LED Neon
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.05), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.9 }));
            visor.position.set(0, 1.2, 0.18);
            group.add(visor);

            return group;
        }

        // --- 6 ROBOT DATA & INISIALISASI ---
        const robots = [
            { name: "alpha", color: 0xff7b00, pos: new THREE.Vector3(-6, 9.1, 3), target: new THREE.Vector3(-6, 9.1, 3), status: "Bekerja di Workstation (L2)" },
            { name: "beta", color: 0x38bdf8, pos: new THREE.Vector3(-2, 9.1, 3), target: new THREE.Vector3(-2, 9.1, 3), status: "Coding System (L2)" },
            { name: "gamma", color: 0xa855f7, pos: new THREE.Vector3(-10, 0.2, -5), target: new THREE.Vector3(-10, 0.2, -5), status: "Bersantai di Sofa (L1)" },
            { name: "delta", color: 0x10b981, pos: new THREE.Vector3(10, 0.2, 5), target: new THREE.Vector3(10, 0.2, 5), status: "Barista di Coffee Bar (L1)" },
            { name: "epsilon", color: 0x3b82f6, pos: new THREE.Vector3(-10, 0.2, 5), target: new THREE.Vector3(-10, 0.2, 5), status: "Menjaga Ruang Sholat (L1)" },
            { name: "zeta", color: 0xec4899, pos: new THREE.Vector3(2, 9.1, 3), target: new THREE.Vector3(2, 9.1, 3), status: "Monitoring Sistem (L2)" }
        ];

        const robotMeshes = robots.map(r => {
            const mesh = createBlockyRobot(r.color);
            mesh.position.copy(r.pos);
            scene.add(mesh);
            return { data: r, mesh: mesh };
        });

        function updateStatusUI() {
            const listEl = document.getElementById('status-list');
            listEl.innerHTML = robots.map(r => `
                <div class="robot-status-item">
                    <b>@${r.name}</b>
                    <span>${r.status}</span>
                </div>
            `).join('');
        }
        updateStatusUI();

        // --- KONTROL LAMPU ---
        let isLightOn = true;
        function toggleLights(status, robotName) {
            isLightOn = status;
            dirLight.intensity = isLightOn ? 1.0 : 0.2;
            neonOrange.intensity = isLightOn ? 2 : 0.2;
            scene.background.setHex(isLightOn ? 0x07090e : 0x020305);
            lightSwitch.material.emissive.setHex(isLightOn ? 0x7c2d12 : 0x047857);
            
            let msg = isLightOn ? "Lampu ruangan dihidupkan." : "Lampu ruangan dimatikan.";
            if(robotName) {
                msg = `Robot @${robotName} menekan saklar dinding dan ${isLightOn ? 'menyalakan' : 'mematikan'} lampu!`;
            }
            document.getElementById('log-box').innerText = msg;
            updateStatusUI();
        }

        // --- SISTEM PERINTAH & ANIMASI JALAN ---
        function sendCommand() {
            const raw = document.getElementById('promptInput').value.trim();
            if(!raw) return;
            const lower = raw.toLowerCase();
            
            let targetRobot = null;
            robotMeshes.forEach(rm => {
                if(lower.includes('@' + rm.data.name)) targetRobot = rm;
            });

            if(targetRobot) {
                if(lower.includes('matikan lampu') || lower.includes('matiin lampu')) {
                    targetRobot.data.target.set(-15, 0.2, 0);
                    targetRobot.data.status = "Berjalan ke Saklar";
                    setTimeout(() => {
                        toggleLights(false, targetRobot.data.name);
                        targetRobot.data.status = "Standby (Lampu Mati)";
                        updateStatusUI();
                    }, 1600);
                } else if(lower.includes('hidupkan lampu') || lower.includes('nyalakan lampu')) {
                    targetRobot.data.target.set(-15, 0.2, 0);
                    targetRobot.data.status = "Berjalan ke Saklar";
                    setTimeout(() => {
                        toggleLights(true, targetRobot.data.name);
                        targetRobot.data.status = "Standby (Lampu Hidup)";
                        updateStatusUI();
                    }, 1600);
                } else if(lower.includes('kopi') || lower.includes('buatkan kopi')) {
                    targetRobot.data.target.set(9, 0.2, 5);
                    targetRobot.data.status = "Meracik Kopi";
                    setTimeout(() => {
                        document.getElementById('log-box').innerText = `Robot @${targetRobot.data.name}: "Secangkir kopi hangat siap untuk Boss Fadli!"`;
                        coffeeCup.material.emissiveIntensity = 0.9;
                        updateStatusUI();
                    }, 1600);
                } else {
                    targetRobot.data.status = "Menjalankan Tugas";
                    document.getElementById('log-box').innerText = `Robot @${targetRobot.data.name} merespons: "${raw}"`;
                    updateStatusUI();
                }
            } else {
                if(lower.includes('matikan lampu')) toggleLights(false);
                else if(lower.includes('hidupkan lampu')) toggleLights(true);
                else document.getElementById('log-box').innerText = `Perintah umum: "${raw}"`;
            }

            document.getElementById('promptInput').value = '';
            updateStatusUI();
        }

        // --- ANIMASI LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            robotMeshes.forEach(rm => {
                rm.mesh.position.lerp(rm.data.target, 0.05);
                if(rm.mesh.position.distanceTo(rm.data.target) < 0.1) {
                    rm.mesh.position.y = rm.data.target.y + Math.sin(time * 5 + rm.mesh.id) * 0.03;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Responsive
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
