<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fadli's Modern AI Virtual Office 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            background: linear-gradient(90deg, #38bdf8, #f43f5e, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }
        #status-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            width: 260px;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .robot-status-item {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .robot-status-item span {
            color: #38bdf8;
            font-weight: 600;
        }
        #control-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 10;
            width: 420px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            background: #090d16;
            border: 1px solid #334155;
            padding: 10px 14px;
            color: white;
            border-radius: 10px;
            flex: 1;
            outline: none;
            font-size: 13px;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        #log-box {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid #38bdf8;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>Fadli's AI Virtual Office 3D</h1>
        <p>Orchestrator: Boss Fadli | Next-Gen AI Workforce</p>
    </div>

    <div id="status-panel">
        <p style="font-weight: bold; color: #fff; margin-bottom: 8px;">LIVE ROBOT STATUS</p>
        <div id="status-list"></div>
    </div>

    <div id="control-panel">
        <div class="input-row">
            <input type="text" id="promptInput" placeholder="Cth: @Delta buat kopi / @Alpha matikan lampu">
            <button onclick="sendCommand()">Kirim</button>
        </div>
        <div id="log-box">Sistem siap. Ketik perintah berformat @namarobot [perintah]...</div>
    </div>

    <script>
        // --- SETUP SCENE, CAMERA, & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.008);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 30);
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- PENCAHAYAAN (TERANG & BERSIH) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(10, 25, 15);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // --- STRUKTUR GEDUNG 2 LANTAI ---
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
        
        // Lantai 1
        const floor1 = new THREE.Mesh(new THREE.BoxGeometry(28, 0.4, 16), floorMat);
        floor1.position.set(0, -0.2, 0);
        scene.add(floor1);

        // Lantai 2
        const floor2 = new THREE.Mesh(new THREE.BoxGeometry(28, 0.4, 16), floorMat);
        floor2.position.set(0, 7.8, 0);
        scene.add(floor2);

        // --- RUANG KERJA BOS (FADLI) DI LANTAI 2 ---
        const bossDesk = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.3, 1.8), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
        bossDesk.position.set(0, 8.15, -5);
        scene.add(bossDesk);

        const fadliAvatar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.6), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
        fadliAvatar.position.set(0, 8.7, -5);
        scene.add(fadliAvatar);

        // --- COFFEE BAR (LANTAI 1) ---
        const coffeeCounter = new THREE.Mesh(new THREE.BoxGeometry(4, 1, 1.6), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        coffeeCounter.position.set(8, 0.5, 4);
        scene.add(coffeeCounter);

        const coffeeMachine = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0x442200 }));
        coffeeMachine.position.set(8, 1.4, 4);
        scene.add(coffeeMachine);

        const coffeeCup = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.3 }));
        coffeeCup.position.set(7.3, 1.1, 4);
        scene.add(coffeeCup);

        // --- SOFA SANTAI (LANTAI 1) ---
        const sofa = new THREE.Mesh(new THREE.BoxGeometry(4, 0.7, 1.6), new THREE.MeshStandardMaterial({ color: 0x475569 }));
        sofa.position.set(-8, 0.35, -4);
        scene.add(sofa);

        // --- GAMING PC (LANTAI 2) ---
        [-6, 6].forEach(x => {
            let pcDesk = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 1.6), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            pcDesk.position.set(x, 8.1, 3);
            scene.add(pcDesk);
            let monitor = new THREE.Mesh(new THREE.BoxGeometry(2, 1.1, 0.1), new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe, emissiveIntensity: 0.6 }));
            monitor.position.set(x, 8.8, 2.9);
            scene.add(monitor);
        });

        // --- SAKLAR LAMPU DINDING ---
        const lightSwitch = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.1), new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x7f1d1d }));
        lightSwitch.position.set(-13.8, 2, 0);
        scene.add(lightSwitch);

        // --- MODEL 3D ROBOT FUTURISTIK ---
        function createFuturisticRobot(colorHex) {
            const group = new THREE.Group();
            
            // Base roda
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            base.position.y = 0.1;
            group.add(base);

            // Bodi
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.8, 16), new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 }));
            body.position.y = 0.6;
            group.add(body);

            // Kepala
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
            head.position.y = 1.1;
            group.add(head);

            // Visor LED
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.15), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.8 }));
            visor.position.set(0, 1.1, 0.1);
            group.add(visor);

            return group;
        }

        // --- 6 ROBOT DATA & INISIALISASI ---
        const robots = [
            { name: "alpha", color: 0x38bdf8, pos: new THREE.Vector3(-6, 8.2, 3), target: new THREE.Vector3(-6, 8.2, 3), status: "Bekerja di PC Gaming (L2)" },
            { name: "beta", color: 0xa855f7, pos: new THREE.Vector3(6, 8.2, 3), target: new THREE.Vector3(6, 8.2, 3), status: "Analisis Data Sistem (L2)" },
            { name: "gamma", color: 0xf97316, pos: new THREE.Vector3(-8, 0.2, -4), target: new THREE.Vector3(-8, 0.2, -4), status: "Bersantai di Sofa (L1)" },
            { name: "delta", color: 0x10b981, pos: new THREE.Vector3(8, 0.2, 4), target: new THREE.Vector3(8, 0.2, 4), status: "Standby di Coffee Bar (L1)" },
            { name: "epsilon", color: 0x3b82f6, pos: new THREE.Vector3(-6, 0.2, 4), target: new THREE.Vector3(-6, 0.2, 4), status: "Menjaga Area (L1)" },
            { name: "zeta", color: 0xec4899, pos: new THREE.Vector3(0, 0.2, 5), target: new THREE.Vector3(0, 0.2, 5), status: "Patroli Lantai 1" }
        ];

        const robotMeshes = robots.map(r => {
            const mesh = createFuturisticRobot(r.color);
            mesh.position.copy(r.pos);
            scene.add(mesh);
            return { data: r, mesh: mesh };
        });

        function updateStatusUI() {
            const listEl = document.getElementById('status-list');
            listEl.innerHTML = robots.map(r => `
                <div class="robot-status-item">
                    <b>@${r.name}</b>
                    <span>${r.status}</span>
                </div>
            `).join('');
        }
        updateStatusUI();

        // --- KONTROL LAMPU ---
        let isLightOn = true;
        function toggleLights(status, robotName) {
            isLightOn = status;
            mainLight.intensity = isLightOn ? 1.2 : 0.2;
            scene.background.setHex(isLightOn ? 0x0b0f19 : 0x020408);
            lightSwitch.material.emissive.setHex(isLightOn ? 0x7f1d1d : 0x047857);
            
            let msg = isLightOn ? "Lampu ruangan dihidupkan." : "Lampu ruangan dimatikan.";
            if(robotName) {
                msg = `Robot @${robotName} menekan saklar dinding dan ${isLightOn ? 'menyalakan' : 'mematikan'} lampu!`;
            }
            document.getElementById('log-box').innerText = msg;
            updateStatusUI();
        }

        // --- SISTEM PERINTAH & ANIMASI JALAN ---
        function sendCommand() {
            const raw = document.getElementById('promptInput').value.trim();
            if(!raw) return;
            const lower = raw.toLowerCase();
            
            let targetRobot = null;
            robotMeshes.forEach(rm => {
                if(lower.includes('@' + rm.data.name)) targetRobot = rm;
            });

            if(targetRobot) {
                if(lower.includes('matikan lampu') || lower.includes('matiin lampu')) {
                    targetRobot.data.target.set(-13, 0.2, 0);
                    targetRobot.data.status = "Berjalan ke Saklar";
                    setTimeout(() => {
                        toggleLights(false, targetRobot.data.name);
                        targetRobot.data.status = "Standby (Lampu Mati)";
                        updateStatusUI();
                    }, 1500);
                } else if(lower.includes('hidupkan lampu') || lower.includes('nyalakan lampu')) {
                    targetRobot.data.target.set(-13, 0.2, 0);
                    targetRobot.data.status = "Berjalan ke Saklar";
                    setTimeout(() => {
                        toggleLights(true, targetRobot.data.name);
                        targetRobot.data.status = "Standby (Lampu Hidup)";
                        updateStatusUI();
                    }, 1500);
                } else if(lower.includes('kopi') || lower.includes('buatkan kopi')) {
                    targetRobot.data.target.set(7.5, 0.2, 4);
                    targetRobot.data.status = "Meracik Kopi";
                    setTimeout(() => {
                        document.getElementById('log-box').innerText = `Robot @${targetRobot.data.name}: "Kopi hangat siap, Boss Fadli!"`;
                        coffeeCup.material.emissiveIntensity = 0.9;
                        updateStatusUI();
                    }, 1500);
                } else {
                    targetRobot.data.status = "Menjalankan Tugas";
                    document.getElementById('log-box').innerText = `Robot @${targetRobot.data.name} merespons: "${raw}"`;
                    updateStatusUI();
                }
            } else {
                if(lower.includes('matikan lampu')) toggleLights(false);
                else if(lower.includes('hidupkan lampu')) toggleLights(true);
                else document.getElementById('log-box').innerText = `Perintah umum: "${raw}"`;
            }

            document.getElementById('promptInput').value = '';
            updateStatusUI();
        }

        // --- ANIMASI LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            robotMeshes.forEach(rm => {
                rm.mesh.position.lerp(rm.data.target, 0.06);
                if(rm.mesh.position.distanceTo(rm.data.target) < 0.1) {
                    rm.mesh.position.y = rm.data.target.y + Math.sin(time * 4 + rm.mesh.id) * 0.04;
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
